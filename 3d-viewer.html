<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sinhala KW — 3D Gold Emblem Interactive Viewer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=Noto+Sans+Sinhala:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Three.js + OrbitControls + GLTFLoader from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: radial-gradient(circle at 50% 35%, #1e293b 0%, #0f172a 60%, #020617 100%);
      font-family: 'Plus Jakarta Sans', 'Noto Sans Sinhala', sans-serif;
      user-select: none;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      display: block;
    }
    .glass-panel {
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }
  </style>
</head>
<body class="text-white">

  <!-- Top Brand Overlay -->
  <header class="fixed top-5 left-5 right-5 z-20 flex items-center justify-between pointer-events-none">
    <div class="glass-panel px-4 py-2.5 rounded-2xl flex items-center gap-3 pointer-events-auto shadow-2xl">
      <img src="assets/logos/tight_logo_w.png" alt="Sinhala KW" class="h-8 w-auto object-contain">
      <div class="border-l border-white/20 pl-3">
        <div class="text-xs font-bold text-amber-400 uppercase tracking-wider">3D Interactive Asset</div>
        <div class="text-sm font-extrabold text-white">සිංහල KW Official Emblem</div>
      </div>
    </div>

    <div class="flex items-center gap-2 pointer-events-auto">
      <a href="index.html" class="glass-panel hover:bg-white/10 transition px-4 py-2 rounded-xl text-xs font-bold flex items-center gap-2 text-slate-200">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
        <span>Back to Website</span>
      </a>
    </div>
  </header>

  <!-- Canvas Container -->
  <div id="canvas-container"></div>

  <!-- Loading Screen -->
  <div id="loading" class="fixed inset-0 z-30 flex flex-col items-center justify-center bg-slate-950/80 backdrop-blur-md transition-opacity duration-500">
    <div class="w-12 h-12 border-4 border-amber-400 border-t-transparent rounded-full animate-spin mb-4"></div>
    <div class="text-sm font-bold text-amber-300 tracking-wider uppercase">Loading 3D Gold Model...</div>
  </div>

  <!-- Bottom Floating Control Bar -->
  <footer class="fixed bottom-6 left-1/2 -translate-x-1/2 z-20 glass-panel rounded-2xl p-2 sm:p-2.5 flex items-center gap-2 shadow-2xl">
    <button id="btnStandalone" class="px-4 py-2 rounded-xl text-xs font-bold transition bg-[#FFC20E] text-slate-950 shadow-md">
      Standalone Emblem
    </button>
    <button id="btnMedallion" class="px-4 py-2 rounded-xl text-xs font-bold transition text-slate-300 hover:text-white hover:bg-white/10">
      Medallion Coin
    </button>
    <div class="h-5 w-px bg-white/20 mx-1"></div>
    <button id="btnAutoRotate" class="p-2 rounded-xl text-xs font-bold transition text-amber-400 hover:bg-white/10" title="Toggle Auto-Rotate">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
    </button>
    <button id="btnResetView" class="p-2 rounded-xl text-xs font-bold transition text-slate-300 hover:bg-white/10" title="Reset Camera">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
    </button>
  </footer>

  <!-- Three.js Setup Script -->
  <script>
    const container = document.getElementById('canvas-container');
    const loadingEl = document.getElementById('loading');

    // Scene
    const scene = new THREE.Scene();

    // Camera
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(2.5, 1.2, 3.5);

    // Renderer
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.35;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    // Orbit Controls
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 2.0;
    controls.maxDistance = 10;
    controls.minDistance = 1.5;

    // Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
    scene.add(ambientLight);

    const dirLight1 = new THREE.DirectionalLight(0xfff5e6, 2.5); // Key warm light
    dirLight1.position.set(5, 5, 5);
    scene.add(dirLight1);

    const dirLight2 = new THREE.DirectionalLight(0x99ccff, 1.8); // Cool rim light
    dirLight2.position.set(-5, 3, -5);
    scene.add(dirLight2);

    const pointLight = new THREE.PointLight(0xffd700, 3, 10);
    pointLight.position.set(0, 0, 3);
    scene.add(pointLight);

    // Models container
    let currentModel = null;
    let standaloneModel = null;
    let medallionModel = null;

    const loader = new THREE.GLTFLoader();

    // Load Standalone
    loader.load('assets/3d/sinhala_kw_emblem_standalone.glb', (gltf) => {
      standaloneModel = gltf.scene;
      tuneMaterials(standaloneModel, true);
      scene.add(standaloneModel);
      currentModel = standaloneModel;
      loadingEl.style.opacity = '0';
      setTimeout(() => loadingEl.style.display = 'none', 500);
    });

    // Load Medallion
    loader.load('assets/3d/sinhala_kw_medallion.glb', (gltf) => {
      medallionModel = gltf.scene;
      tuneMaterials(medallionModel, false);
      medallionModel.visible = false;
      scene.add(medallionModel);
    });

    function tuneMaterials(obj, isStandalone) {
      obj.traverse((child) => {
        if (child.isMesh && child.material) {
          // Boost luxury gold look
          if (child.name.includes('Emblem') || child.name.includes('Rim') || isStandalone) {
            child.material.metalness = 0.95;
            child.material.roughness = 0.18;
            child.material.color = new THREE.Color(0xFFC20E);
          }
        }
      });
    }

    // UI Buttons
    const btnStandalone = document.getElementById('btnStandalone');
    const btnMedallion = document.getElementById('btnMedallion');
    const btnAutoRotate = document.getElementById('btnAutoRotate');
    const btnResetView = document.getElementById('btnResetView');

    btnStandalone.addEventListener('click', () => {
      if (standaloneModel && medallionModel) {
        standaloneModel.visible = true;
        medallionModel.visible = false;
        currentModel = standaloneModel;
        btnStandalone.className = 'px-4 py-2 rounded-xl text-xs font-bold transition bg-[#FFC20E] text-slate-950 shadow-md';
        btnMedallion.className = 'px-4 py-2 rounded-xl text-xs font-bold transition text-slate-300 hover:text-white hover:bg-white/10';
      }
    });

    btnMedallion.addEventListener('click', () => {
      if (standaloneModel && medallionModel) {
        standaloneModel.visible = false;
        medallionModel.visible = true;
        currentModel = medallionModel;
        btnMedallion.className = 'px-4 py-2 rounded-xl text-xs font-bold transition bg-[#FFC20E] text-slate-950 shadow-md';
        btnStandalone.className = 'px-4 py-2 rounded-xl text-xs font-bold transition text-slate-300 hover:text-white hover:bg-white/10';
      }
    });

    btnAutoRotate.addEventListener('click', () => {
      controls.autoRotate = !controls.autoRotate;
      btnAutoRotate.style.color = controls.autoRotate ? '#FFC20E' : '#94a3b8';
    });

    btnResetView.addEventListener('click', () => {
      camera.position.set(2.5, 1.2, 3.5);
      controls.target.set(0, 0, 0);
      controls.update();
    });

    // Resize handler
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Animation Loop
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
